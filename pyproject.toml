[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-world-model"
version = "0.1.0"
description = "Reproducible video-based ball dynamics and residual physics experiments"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.7,<3", "numpy>=1.26,<3", "matplotlib>=3.8,<4",
  "pillow>=10", "imageio>=2.34", "imageio-ffmpeg>=0.5"
]

[project.optional-dependencies]
dev = ["pytest>=8", "nbformat>=5", "nbclient>=0.10", "ipykernel>=6"]
notebook = ["jupyterlab>=4", "ipykernel>=6"]

[tool.setuptools.packages.find]
include = ["nwm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

